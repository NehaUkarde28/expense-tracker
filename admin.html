<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FOR YOUU | Admin Panel</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff7f9;
            color: #333;
        }

        /* HEADER */

        .header {
            background: #f7b6c8;
            padding: 22px;
            text-align: center;
        }

        .header h1 {
            color: white;
            font-size: 30px;
        }

        .header p {
            color: white;
            margin-top: 6px;
        }

        /* CONTAINER */

        .container {
            width: 92%;
            max-width: 1000px;
            margin: 30px auto;
        }

        /* CARD */

        .card {
            background: white;
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        h2 {
            color: #e58ca8;
            margin-bottom: 20px;
        }

        /* FORM */

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #e89ab2;
        }

        textarea {
            height: 110px;
            resize: vertical;
        }

        /* BEST SELLER */

        .best-seller-box {
            margin-top: 18px;
            padding: 15px;
            background: #fff5f8;
            border: 1px solid #f2d5df;
            border-radius: 12px;
        }

        .best-seller-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
            cursor: pointer;
            font-weight: bold;
            color: #555;
        }

        .best-seller-label input {
            width: 18px;
            height: 18px;
            accent-color: #e89ab2;
            cursor: pointer;
        }

        .best-seller-help {
            margin-top: 7px;
            margin-left: 28px;
            font-size: 13px;
            color: #888;
        }

        /* IMAGE PREVIEW */

        .preview {
            margin-top: 15px;
            width: 180px;
            height: 180px;
            border-radius: 15px;
            object-fit: cover;
            display: none;
        }

        /* SAVE BUTTON */

        .save-btn {
            width: 100%;
            margin-top: 28px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #e89ab2;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #dc7f9d;
        }

        .save-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* MESSAGE */

        .message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
            min-height: 20px;
        }

        /* PRODUCTS */

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .product-card {
            border: 1px solid #f0dce2;
            border-radius: 18px;
            overflow: hidden;
            background: white;
        }

        .product-info {
            padding: 18px;
        }

        .product-info h3 {
            color: #444;
            margin-bottom: 8px;
        }

        .product-info p {
            color: #777;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .price {
            color: #e58ca8;
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0;
        }

        .details {
            font-size: 13px;
            color: #777;
            margin-top: 5px;
        }

        /* BEST SELLER BADGE */

        .best-seller-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 7px 12px;
            border-radius: 20px;
            background: #fff0f5;
            color: #e58ca8;
            font-size: 13px;
            font-weight: bold;
        }

        .normal-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 7px 12px;
            border-radius: 20px;
            background: #f5f5f5;
            color: #888;
            font-size: 13px;
            font-weight: bold;
        }

        /* DELETE BUTTON */

        .delete-btn {
            width: 100%;
            padding: 11px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            background: #f3a6a6;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #e88888;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #888;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #e58ca8;
        }

        /* MOBILE */

        @media (max-width: 650px) {

            .container {
                width: 94%;
                margin: 20px auto;
            }

            .card {
                padding: 20px;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="header">

        <h1>🎀 FOR YOUU</h1>

        <p>Admin Panel</p>

    </div>



    <div class="container">


        <!-- ================================= -->
        <!-- ADD PRODUCT -->
        <!-- ================================= -->

        <div class="card">

            <h2>➕ Add New Product</h2>


            <!-- PHOTO -->

            <label>Product Photo</label>

            <input
                type="file"
                id="productImage"
                accept="image/*"
            >

            <img
                id="imagePreview"
                class="preview"
                alt="Product Preview"
            >


            <!-- NAME -->

            <label>Product Name</label>

            <input
                type="text"
                id="productName"
                placeholder="Example: Birthday Photo Hamper"
            >


            <!-- PRICE -->

            <label>Price (₹)</label>

            <input
                type="number"
                id="productPrice"
                placeholder="Example: 499"
                min="0"
            >


            <!-- DESCRIPTION -->

            <label>Description</label>

            <textarea
                id="productDescription"
                placeholder="Write product description..."
            ></textarea>


            <!-- OCCASION -->

            <label>Occasion</label>

            <select id="productOccasion">

                <option value="">
                    Select Occasion
                </option>

                <option value="Birthday">
                    Birthday
                </option>

                <option value="Anniversary">
                    Anniversary
                </option>

                <option value="Wedding">
                    Wedding
                </option>

                <option value="Thank You">
                    Thank You
                </option>

                <option value="Festivals">
                    Festivals
                </option>

            </select>


            <!-- RECIPIENT -->

            <label>Recipient</label>

            <select id="productRecipient">

                <option value="">
                    Select Recipient
                </option>

                <option value="Mom">
                    Mom
                </option>

                <option value="Dad">
                    Dad
                </option>

                <option value="Sister">
                    Sister
                </option>

                <option value="Brother">
                    Brother
                </option>

                <option value="Friend">
                    Friend
                </option>

                <option value="BFF">
                    BFF
                </option>

                <option value="Boyfriend">
                    Boyfriend
                </option>

                <option value="Girlfriend">
                    Girlfriend
                </option>

                <option value="Husband">
                    Husband
                </option>

                <option value="Teacher">
                    Teacher
                </option>

            </select>


            <!-- BEST SELLER -->

            <div class="best-seller-box">

                <label class="best-seller-label">

                    <input
                        type="checkbox"
                        id="bestSeller"
                    >

                    <span>
                        ⭐ Show in Best Sellers
                    </span>

                </label>

                <div class="best-seller-help">

                    Tick this if you want this product
                    to appear in the Best Sellers section.

                </div>

            </div>


            <!-- SAVE -->

            <button
                class="save-btn"
                id="saveProductBtn"
            >
                💾 Save Product
            </button>


            <div
                id="message"
                class="message"
            ></div>

        </div>



        <!-- ================================= -->
        <!-- PRODUCTS -->
        <!-- ================================= -->

        <div class="card">

            <h2>📦 Your Products</h2>

            <div
                id="productsGrid"
                class="products-grid"
            >

                <div class="loading">
                    Loading products...
                </div>

            </div>

        </div>


    </div>



    <!-- ================================= -->
    <!-- FIREBASE -->
    <!-- ================================= -->

    <script type="module">


        // Firebase App

        import {
            initializeApp
        } from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


        // Firestore

        import {
            getFirestore,
            collection,
            addDoc,
            getDocs,
            deleteDoc,
            doc
        } from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



        // =====================================
        // FIREBASE CONFIG
        // =====================================

        const firebaseConfig = {

            apiKey:
                "AIzaSyAuDprN8ouLRbroP37X0EHCzjJhGTXbwg",

            authDomain:
                "for-youu-5e121.firebaseapp.com",

            projectId:
                "for-youu-5e121",

            storageBucket:
                "for-youu-5e121.firebasestorage.app",

            messagingSenderId:
                "256649283397",

            appId:
                "1:256649283397:web:e38a953abccbf75e23e02c",

            measurementId:
                "G-EFSFPQT29S"

        };



        // =====================================
        // INITIALIZE FIREBASE
        // =====================================

        const app =
            initializeApp(firebaseConfig);


        const db =
            getFirestore(app);



        // =====================================
        // IMAGE PREVIEW
        // =====================================

        document
            .getElementById("productImage")
            .addEventListener(
                "change",
                function () {

                    const file =
                        this.files[0];


                    if (file) {

                        const preview =
                            document.getElementById(
                                "imagePreview"
                            );


                        preview.src =
                            URL.createObjectURL(
                                file
                            );


                        preview.style.display =
                            "block";

                    }

                }
            );



        // =====================================
        // SAVE PRODUCT
        // =====================================

        async function saveProduct() {


            const name =
                document
                    .getElementById(
                        "productName"
                    )
                    .value
                    .trim();


            const price =
                document
                    .getElementById(
                        "productPrice"
                    )
                    .value;


            const description =
                document
                    .getElementById(
                        "productDescription"
                    )
                    .value
                    .trim();


            const occasion =
                document
                    .getElementById(
                        "productOccasion"
                    )
                    .value;


            const recipient =
                document
                    .getElementById(
                        "productRecipient"
                    )
                    .value;


            const bestSeller =
                document
                    .getElementById(
                        "bestSeller"
                    )
                    .checked;


            const message =
                document.getElementById(
                    "message"
                );


            const button =
                document.getElementById(
                    "saveProductBtn"
                );



            // =================================
            // VALIDATION
            // =================================

            if (
                !name ||
                !price ||
                !description ||
                !occasion ||
                !recipient
            ) {

                message.innerText =
                    "⚠️ Please fill all details.";

                return;

            }



            button.disabled = true;

            button.innerText =
                "Saving...";



            try {


                // =================================
                // FIRESTORE SAVE
                // =================================

                await addDoc(
                    collection(
                        db,
                        "products"
                    ),
                    {

                        name:
                            name,

                        price:
                            Number(price),

                        description:
                            description,

                        occasion:
                            occasion,

                        recipient:
                            recipient,

                        bestSeller:
                            bestSeller,

                        createdAt:
                            new Date()

                    }
                );



                // SUCCESS

                message.innerText =
                    "✅ Product saved successfully!";


                // CLEAR FORM

                document
                    .getElementById(
                        "productName"
                    )
                    .value = "";


                document
                    .getElementById(
                        "productPrice"
                    )
                    .value = "";


                document
                    .getElementById(
                        "productDescription"
                    )
                    .value = "";


                document
                    .getElementById(
                        "productOccasion"
                    )
                    .value = "";


                document
                    .getElementById(
                        "productRecipient"
                    )
                    .value = "";


                document
                    .getElementById(
                        "bestSeller"
                    )
                    .checked = false;


                document
                    .getElementById(
                        "productImage"
                    )
                    .value = "";


                document
                    .getElementById(
                        "imagePreview"
                    )
                    .style.display = "none";



                // Reload products

                loadProducts();


            }

            catch (error) {

                console.error(
                    "Firebase Error:",
                    error
                );


                message.innerText =
                    "❌ Product save झाला नाही.";

            }



            button.disabled = false;

            button.innerText =
                "💾 Save Product";

        }



        // =====================================
        // LOAD PRODUCTS
        // =====================================

        async function loadProducts() {


            const productsGrid =
                document.getElementById(
                    "productsGrid"
                );


            productsGrid.innerHTML =
                `<div class="loading">
                    Loading products...
                </div>`;


            try {


                const querySnapshot =
                    await getDocs(
                        collection(
                            db,
                            "products"
                        )
                    );


                productsGrid.innerHTML =
                    "";


                if (
                    querySnapshot.empty
                ) {

                    productsGrid.innerHTML =
                        `<div class="empty">
                            📦 No products added yet.
                        </div>`;

                    return;

                }



                querySnapshot.forEach(
                    (product) => {


                        const data =
                            product.data();


                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "product-card";



                        // BEST SELLER STATUS

                        let bestSellerStatus = "";

                        if (
                            data.bestSeller === true
                        ) {

                            bestSellerStatus = `
                                <div class="best-seller-badge">
                                    ⭐ Best Seller
                                </div>
                            `;

                        } else {

                            bestSellerStatus = `
                                <div class="normal-badge">
                                    Normal Product
                                </div>
                            `;

                        }



                        card.innerHTML = `

                            <div class="product-info">

                                <h3>
                                    ${data.name || "Unnamed Product"}
                                </h3>

                                <p>
                                    ${data.description || ""}
                                </p>

                                <div class="price">
                                    ₹${data.price || 0}
                                </div>

                                <div class="details">
                                    🎂 Occasion:
                                    ${data.occasion || "-"}
                                </div>

                                <div class="details">
                                    👤 Recipient:
                                    ${data.recipient || "-"}
                                </div>

                                ${bestSellerStatus}

                                <button
                                    class="delete-btn"
                                    data-id="${product.id}"
                                >
                                    🗑️ Delete Product
                                </button>

                            </div>

                        `;


                        productsGrid.appendChild(
                            card
                        );


                        // DELETE BUTTON

                        card
                            .querySelector(
                                ".delete-btn"
                            )
                            .addEventListener(
                                "click",
                                function () {

                                    deleteProduct(
                                        product.id
                                    );

                                }
                            );

                    }
                );


            }

            catch (error) {

                console.error(
                    "Load Error:",
                    error
                );


                productsGrid.innerHTML =
                    `<div class="empty">
                        ❌ Products load झाले नाहीत.
                    </div>`;

            }

        }



        // =====================================
        // DELETE PRODUCT
        // =====================================

        async function deleteProduct(
            productId
        ) {


            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this product?"
                );


            if (!confirmDelete) {

                return;

            }



            try {


                await deleteDoc(
                    doc(
                        db,
                        "products",
                        productId
                    )
                );


                alert(
                    "✅ Product deleted successfully!"
                );


                loadProducts();


            }

            catch (error) {

                console.error(
                    "Delete Error:",
                    error
                );


                alert(
                    "❌ Product delete झाला नाही."
                );

            }

        }



        // =====================================
        // BUTTON
        // =====================================

        document
            .getElementById(
                "saveProductBtn"
            )
            .addEventListener(
                "click",
                saveProduct
            );



        // =====================================
        // LOAD PRODUCTS ON START
        // =====================================

        loadProducts();


    </script>


</body>

</html>
